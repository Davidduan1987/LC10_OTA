CONFIG_SYS_CLOCK_EXISTS=n
CONFIG_NRF_GRTC_TIMER=n
CONFIG_CRACEN_IKG=n
CONFIG_FPROTECT=y


CONFIG_BOOT_WATCHDOG_FEED=n

# nRF54LC10A supports a write buffer of at most 16 bytes (default)

# Enter the firmware loader when the application requests it through the boot mode retention.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOT_FIRMWARE_LOADER_BOOT_MODE=y
